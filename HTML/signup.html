<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - RichHub</title>
  <link rel="stylesheet" href="style.css">
</head> 
  <body>  
    <div class="form-container"><h1>RichHub</h1>
<h2>Create Account</h2>

<form id="signupForm">

  <input
    type="text"
    id="signupName"
    placeholder="Full Name"
    required
  >

  <input
    type="email"
    id="signupEmail"
    placeholder="Email"
    required
  >

  <input
    type="password"
    id="signupPassword"
    placeholder="Password"
    required
  >

  <button type="submit">Create Account</button>

</form>

<p id="signupMessage"></p>

<p>
  Already have an account?
  <a href="login.html">Log In</a>
</p>

  </div>  <script type="module" src="script.js"></script></body>
</html>
