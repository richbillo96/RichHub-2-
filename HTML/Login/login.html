<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RichHub | Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <div class="auth-card">

            <!-- BRAND -->
            <div class="brand">
                <div class="logo">R</div>

                <h1>RichHub</h1>

                <p>Build your store. Sell online. Grow.</p>
            </div>


            <!-- LOGIN -->
            <section id="loginSection">

                <h2>Welcome Back</h2>

                <p class="description">
                    Login to your RichHub account
                </p>

                <form id="loginForm">

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >


                    <button
                        type="submit"
                        class="main-button"
                    >
                        Login
                    </button>

                </form>


                <p class="switch-text">
                    Don't have an account?

                    <button
                        type="button"
                        id="showSignup"
                    >
                        Create Account
                    </button>
                </p>

            </section>


            <!-- SIGN UP -->
            <section
                id="signupSection"
                class="hidden"
            >

                <h2>Create Account</h2>

                <p class="description">
                    Start your RichHub journey
                </p>

                <form id="signupForm">

                    <label for="signupName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your full name"
                        required
                    >


                    <label for="signupEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >


                    <button
                        type="submit"
                        class="main-button"
                    >
                        Create Account
                    </button>

                </form>


                <p class="switch-text">
                    Already have an account?

                    <button
                        type="button"
                        id="showLogin"
                    >
                        Login
                    </button>
                </p>

            </section>


            <!-- MESSAGE -->
            <div id="message"></div>

        </div>

    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="hub.js"></script>

</body>

    </html>
